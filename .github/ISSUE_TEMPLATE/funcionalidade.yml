name: Funcionalidade
description: Proponha uma nova funcionalidade ou melhoria
title: 'feat: '
labels: ['funcionalidade']
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual necessidade do jogador isto atende?
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] O jogador consegue...
        - [ ] O jogo impede...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [jogador N-7 (movimento/controles), mapa hexagonal e névoa, eventos e narrativa, recursos (bateria/integridade/carga), interface (HUD/menu), áudio, testes/pipeline]
    validations:
      required: true
